name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Instalar plataforma e build-tools
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes de domínio
        run: ./gradlew :domain:test

      - name: Testes de dados (Room, backup, mapeamento)
        run: ./gradlew :data:testDebugUnitTest

      - name: Testes do app
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint Android (SAST leve)
        run: ./gradlew :app:lintDebug :data:lintDebug

      - name: Build de debug
        run: ./gradlew :app:assembleDebug

      - name: Upload de relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            */build/reports/
            */build/test-results/

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
